plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"deepslate_instamine" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Opt-in disposable native fixture; never part of the distributable JAR.
if (project.hasProperty("integrationTests")) {
    sourceSets {
        testmod {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            "deepslate_instamine_test" {
                sourceSet sourceSets.testmod
            }
        }
        runs {
            integrationServer {
                server()
                source sourceSets.testmod
                runDir (project.findProperty("testRunDir") ?: "local/integration-server")
                vmArg "-Ddeepslate.test.phase=${project.findProperty("testPhase") ?: "default"}"
                programArg "nogui"
            }
        }
    }
}
